<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日のミッション</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

    <script src="app.js" defer></script>
</head>

<body>
    <main class="home-screen">

        <!-- ホーム画面 -->
        <section id="home-screen">
            <header class="streak">
                <div class="streak-info">
                    <span class="orbit-icon"><i class="ti ti-sparkles"></i></span>
                    <span>連続 5日</span>
                </div>

            </header>

            <section class="mission">
                <div class="mission-label">
                    <span class="moon-icon">☾</span>
                    <span>今日のミッション</span>
                </div>

                <h1 class="mission-title" id="home-theme"></h1>

                <div class="title-decoration"></div>

                <p class="mission-description" id="home-description"></p>

                <button class="start-button" id="start-button" type="button">
                    旅をはじめる <i class="ti ti-rocket"></i>
                </button>
            </section>
        </section>


        <!-- 作文画面 -->
        <section id="writing-screen" hidden>

            <!-- ホーム画面と同じタイトル・説明文 -->
            <section class="mission writing-intro">
                <div class="mission-label">
                    <span class="moon-icon">☾</span>
                    <span>今日のミッション</span>
                </div>

                <h1 class="mission-title" id="writing-theme"></h1>

                <div class="title-decoration"></div>

                <p class="mission-description" id="writing-description"></p>

            </section>


            <div class="mission-content">

                <!-- ミッションカード -->
                <section class="mission-card">

                    <div class="mission-section">
                        <h2 class="section-title">状況</h2>

                        <ul class="situation-list">
                            <li id="situation1"></li>
                            <li id="situation2"></li>
                            <li id="situation3"></li>
                        </ul>
                    </div>

                    <div class="mission-section">
                        <h2 class="section-title">ミッション</h2>

                        <p id="mission"></p>

                        <ul class="mission-points">
                            <li id="condition1"></li>
                            <li id="condition2"></li>
                            <li id="condition3"></li>
                        </ul>
                    </div>

                </section>


                <!-- 作成する・言語選択 -->
                <div class="writing-toolbar">
                    <div class="writing-heading">
                        <i class="ti ti-writing"></i><span>作成する</span>
                    </div>

                    <label class="language-select">

                        <select id="writing-language" aria-label="作文の言語">
                            <option value="fr">Français</option>
                            <option value="en">English</option>
                            <option value="ko">한국어</option>
                            <option value="zh">中文</option>
                        </select>

                        <i class="ti ti-chevron-down" aria-hidden="true"></i>
                    </label>
                </div>


                <!-- 作文入力欄 -->
                <section class="writing-section">

                    <div class="writing-window-header">
                        <div class="window-controls" aria-hidden="true">
                            <span class="window-dot close"></span>
                            <span class="window-dot minimize"></span>
                            <span class="window-dot maximize"></span>
                        </div>

                        <span class="window-title">Éditeur de texte</span>
                    </div>

                    <form class="writing-body" id="writing-form">
                        <time class="writing-date" id="writing-date"></time>

                        <textarea id="writing-input" class="writing-input" placeholder="Saisie..." lang="fr"
                            aria-label="フランス語の作文"></textarea>

                        <div class="writing-actions">
                            <button class="submit-button" id="submit-button" type="submit" aria-label="送信">
                                <i class="ti ti-send" aria-hidden="true"></i>
                            </button>
                        </div>
                    </form>

                </section>


            </div>
        </section>

        <!-- Correction result screen -->
        <section id="result-screen" hidden>
            <header class="streak">
                <button type="button" class="back-link" id="result-back-button">
                    ← 作文に戻る
                </button>
                <span class="page-label">RESULT</span>
            </header>

            <section class="mission">
                <div class="mission-label">
                    <span class="moon-icon" aria-hidden="true">☾</span>
                    <span>添削結果</span>
                </div>

                <h1 class="mission-title" id="result-theme"></h1>
                <div class="title-decoration"></div>
            </section>

            <section class="mission-content">
                <h2 class="section-title">あなたの作文</h2>
                <p id="result-original"></p>

                <h2 class="section-title">添削・アドバイス</h2>
                <p id="correction-feedback"></p>
                <button type="button" class="copy-result-button" id="copy-result-button">
                    <span aria-hidden="true"><i class="ti ti-copy"></i></span>
                    作文・添削結果を一括コピー
                </button>
                <p id="copy-result-status" role="status" aria-live="polite"></p>

                <p id="correction-feedback"></p>
            </section>
        </section>


    </main>
</body>

</html>
